<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>דו״ח 2</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Rubik:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="report-card" aria-labelledby="page-title">
        <header class="hero">
          <img class="logo" src="/logo.png" alt="" />
          <h1 id="page-title">דו״ח 2</h1>
        </header>

        <form id="report-form" novalidate>
          <fieldset>
            <legend>בחרי אפשרות אחת</legend>
            <div class="status-options">
              <button class="status-option" type="button" data-status="מחייכת" aria-pressed="false">
                <span class="status-icon happy">☺</span>
                <span class="status-copy"><strong>מחייכת</strong><small>הכול בסדר היום</small></span>
                <span class="selection-mark" aria-hidden="true">✓</span>
              </button>
              <button class="status-option" type="button" data-status="לא מחייכת" aria-pressed="false">
                <span class="status-icon sad">☹</span>
                <span class="status-copy"><strong>לא מחייכת</strong><small>זקוקה לתשומת לב</small></span>
                <span class="selection-mark" aria-hidden="true">✓</span>
              </button>
            </div>
          </fieldset>

          <label class="note-label" for="note">הערה <span>אופציונלי</span></label>
          <textarea id="note" name="note" rows="4" maxlength="1000" aria-label="הערה אופציונלית"></textarea>
          <p id="form-message" class="form-message" role="alert" hidden></p>
          <button id="submit-button" class="submit-button" type="submit"><span>שלחי דיווח</span><span aria-hidden="true">←</span></button>
        </form>

        <section id="success-message" class="success-message" hidden>
          <div class="success-icon" aria-hidden="true">✓</div>
          <h2>הדיווח נשלח</h2>
          <p>תודה, הדיווח שלך התקבל בהצלחה.</p>
          <button id="send-another" type="button">שלחי דיווח נוסף</button>
        </section>
      </section>
    </main>
    <script src="/script.js"></script>
  </body>
</html>
